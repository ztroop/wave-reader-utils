name: Build Status
on:
  push:
    branches:
      - master
    paths:
      - 'wave_reader/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libglib2.0-dev bluez -y
        python -m pip install --upgrade pip
        pip install poetry
    - name: Install Project
      run: |
        poetry install
    - name: Run Tests
      run: |
        poetry run flake8 wave_reader/ tests/
        poetry run mypy wave_reader --ignore-missing-imports
        poetry run pytest ./tests
